[tun]
name = "tunB"
addr = "10.10.0.2/24"
link_mtu = 18000
add_route = true
gray_routes = []
mtu = 17972

[transport]
listen = "172.30.0.2:25555"
udp_rbuf = 33554432
udp_wbuf = 33554432
zerocopy = false

[map]
path = "conf/ns2-peers.toml"

[batch]
hold = "5ms"
warmup = "1s"

[log]
level = "info"

[debug]
pprof_listen = "127.0.0.1:6062"
