# sample config for a systemd deployment
# install target:
#   /etc/l3overlay/config.toml

[tun]
name = "tun0"                  # TUN interface name
addr = "10.10.0.10/24"         # local overlay IPv4 address
link_mtu = 9000                # interface MTU on the host
add_route = true               # add the connected route for addr via TUN
gray_routes = []               # optional extra routes via TUN
mtu = 8972                     # safe inner MTU for a 9000-byte UDP underlay

[transport]
listen = "0.0.0.0:5555"        # local UDP bind address
listeners = 1                  # keep a single listener by default
reuse_port = false             # enable only after targeted verification
udp_rbuf = 33554432            # requested UDP RX buffer (32 MiB)
udp_wbuf = 33554432            # requested UDP TX buffer (32 MiB)

[map]
path = "/etc/l3overlay/peers.toml"

[batch]
hold = "25us"                  # current runtime-tuned TX batch hold
warmup = "2s"                  # flush each packet during warmup

[log]
level = "info"                 # debug|info|warn|error

[debug]
pprof_listen = ""              # empty string disables pprof
